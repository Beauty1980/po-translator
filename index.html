<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Перевод PO и инвойса — Tien-Shan Engineering</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: #f5f5f0; color: #1a1a1a; min-height: 100vh; padding: 2rem 1rem; }
.container { max-width: 620px; margin: 0 auto; }
.logo { display: flex; align-items: center; gap: 10px; margin-bottom: 1.5rem; }
.logo-mark { width: 36px; height: 36px; background: #1a1a1a; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; color: white; font-weight: 700; }
.logo-text { font-size: 13px; color: #888; }
.card { background: white; border-radius: 12px; padding: 1.25rem; margin-bottom: 12px; border: 1px solid #e8e8e4; }
.card-label { font-size: 11px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 10px; }
.drop-zone { border: 1.5px dashed #d0d0cc; border-radius: 8px; padding: 1.5rem; text-align: center; cursor: pointer; transition: background .15s; position: relative; }
.drop-zone:hover, .drop-zone.drag { background: #f8f8f5; border-color: #aaa; }
.drop-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.drop-icon { font-size: 28px; margin-bottom: 8px; }
.drop-text { font-size: 14px; color: #888; }
.drop-hint { font-size: 12px; color: #aaa; margin-top: 4px; }
.file-ok { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: #f0faf4; border-radius: 8px; margin-top: 8px; border: 1px solid #c3e6d0; }
.file-ok .ico { font-size: 18px; }
.file-ok .name { font-size: 13px; color: #1a1a1a; flex: 1; word-break: break-all; }
.file-ok .clear { font-size: 12px; color: #888; background: none; border: none; cursor: pointer; padding: 2px 8px; border-radius: 4px; }
.run-btn { width: 100%; padding: 14px; font-size: 15px; font-weight: 600; background: #1a1a1a; color: white; border: none; border-radius: 10px; cursor: pointer; margin-top: 4px; transition: background .15s; }
.run-btn:disabled { background: #ccc; cursor: not-allowed; }
.progress-wrap { margin-top: 12px; display: none; }
.progress-track { height: 4px; background: #e8e8e4; border-radius: 2px; overflow: hidden; }
.progress-bar { height: 100%; background: #1a1a1a; border-radius: 2px; transition: width .4s ease; }
.progress-label { font-size: 12px; color: #888; margin-top: 6px; }
.log { background: #f8f8f5; border-radius: 8px; padding: 12px; font-size: 12px; font-family: monospace; color: #666; max-height: 160px; overflow-y: auto; margin-top: 12px; display: none; line-height: 1.8; border: 1px solid #e8e8e4; }
.log .ok { color: #1a7a40; }
.log .err { color: #c0392b; }
.downloads { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.dl-btn { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: white; border-radius: 10px; border: 1px solid #e8e8e4; cursor: pointer; text-decoration: none; transition: background .12s; color: #1a1a1a; }
.dl-btn:hover { background: #f5f5f0; }
.dl-icon { font-size: 22px; }
.dl-info { flex: 1; }
.dl-name { font-size: 14px; font-weight: 500; }
.dl-desc { font-size: 12px; color: #888; margin-top: 2px; }
.dl-ext { font-size: 11px; font-weight: 600; color: #666; background: #f0f0ec; padding: 3px 8px; border-radius: 5px; text-transform: uppercase; }
.section-title { font-size: 12px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: .08em; margin: 16px 0 8px; }
.error-box { background: #fff5f5; border: 1px solid #fcc; border-radius: 8px; padding: 12px 16px; font-size: 13px; color: #c0392b; margin-top: 12px; display: none; }
</style>
</head>
<body>
<div class="container">
<div class="logo"><div class="logo-mark">TS</div><div class="logo-text">Tien-Shan Engineering LLP</div></div>
<div style="margin-bottom:2rem"><h1 style="font-size:22px;font-weight:600;margin-bottom:4px">Перевод PO и инвойса</h1><p style="font-size:14px;color:#666">Загрузи два исходных файла — получи три готовых</p></div>
<div class="card"><div class="card-label">Файл 1 — Purchase Order (Excel .xlsx)</div><div class="drop-zone" id="dz1"><input type="file" accept=".xlsx" id="f1"><div class="drop-icon">📊</div><div class="drop-text">Нажми или перетащи файл PO</div><div class="drop-hint">.xlsx</div></div><div id="f1info"></div></div>
<div class="card"><div class="card-label">Файл 2 — Proforma Invoice (PDF)</div><div class="drop-zone" id="dz2"><input type="file" accept=".pdf" id="f2"><div class="drop-icon">📄</div><div class="drop-text">Нажми или перетащи PDF инвойс</div><div class="drop-hint">.pdf</div></div><div id="f2info"></div></div>
<button class="run-btn" id="runBtn" disabled>Создать переводы</button>
<div class="progress-wrap" id="progressWrap"><div class="progress-track"><div class="progress-bar" id="progressBar" style="width:0%"></div></div><div class="progress-label" id="progressLabel">Обрабатываю...</div></div>
<div class="error-box" id="errorBox"></div>
<div class="log" id="logBox"></div>
<div id="outputSection" style="display:none"><div class="section-title">Готовые файлы</div><div class="downloads" id="downloads"></div></div>
</div>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const state={xlsxFile:null,pdfFile:null};
function setupDrop(dzId,inputId,infoId,ext){const dz=document.getElementById(dzId);const inp=document.getElementById(inputId);inp.addEventListener('change',()=>{if(inp.files[0])setFile(inp.files[0],infoId,ext,dzId);});dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('drag');});dz.addEventListener('dragleave',()=>dz.classList.remove('drag'));dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('drag');const f=e.dataTransfer.files[0];if(f)setFile(f,infoId,ext,dzId);});}
function setFile(file,infoId,ext,dzId){const info=document.getElementById(infoId);info.innerHTML='<div class="file-ok"><span class="ico">✅</span><span class="name">'+file.name+'</span><button class="clear" onclick="clearFile(\''+infoId+'\',\''+ext+'\',\''+dzId+'\')">Удалить</button></div>';if(ext==='xlsx')state.xlsxFile=file;else state.pdfFile=file;checkReady();}
function clearFile(infoId,ext,dzId){document.getElementById(infoId).innerHTML='';if(ext==='xlsx'){state.xlsxFile=null;document.getElementById('f1').value='';}else{state.pdfFile=null;document.getElementById('f2').value='';}checkReady();}
function checkReady(){document.getElementById('runBtn').disabled=!(state.xlsxFile&&state.pdfFile);}
setupDrop('dz1','f1','f1info','xlsx');setupDrop('dz2','f2','f2info','pdf');
const EN_TO_RU={"Supplier:":"Поставщик:","Buyer:":"Покупатель:","Rotork quot. ref.":"Ссылка на квотацию Rotork","Delivery terms:":"Условия поставки:","Delivery time:":"Срок поставки:","Payment terms:":"Условия оплаты:","End user:":"Конечный пользователь:","Tien-Shan Engineering LLP":"ТОО Тянь-Шань Engineering ","ATAKENT, Timiryazeva 42 str., pavilion 17":"АТАКЕНТ, ул.  Тимирязева 42, павильон 17","Almaty, 050057, Kazakhstan":"Алматы, 050057, Казахстан","9 Brown Lane West, Holbeck":"9 Браун Лейн Уэст Холбек","Leeds LS12 6BH":"Лидс LS12 6BH","EXW Leeds":"EXW Лидс","30% payable with order, 70% payable prior delivery":"30% оплата с заказом, 70% оплата перед доставкой","North Caspian Operating Company N.V., Kazakhstan Branch":"Норт Каспиан Оперейтинг Компани Н.В.","Limit Switch Box Soldo":"Блок концевых выключателей Soldo","Limit Switch Box":"Блок концевых выключателей"};
const ATTENTION_MAP={"Rachel Tam":"Рэйчел Тэм","Timur Nabiullin":"Тимур Набиуллин"};
const TRANSLATE_COORDS=["C2","C3","B5","D5","D6","B7","D7","B8","D8","B9","D9","B10","C12","C13","C14","D13","C15","D15","C16","D16"];
function translateCell(val){if(!val)return val;const s=String(val).trim();if(EN_TO_RU[s])return EN_TO_RU[s];if(s.startsWith("Attention:")){const nm=s.slice(10).trim();return"Вниманию: "+(ATTENTION_MAP[nm]||nm);}if(s.startsWith("E-mail:")&&s.includes("Rachel"))return s.replace("E-mail:","Эл. почта:");let r=s;for(const[en,ru]of Object.entries(EN_TO_RU))r=r.replaceAll(en,ru);return r;}
function translateHeader(v){return String(v).replace("PO #","Заказ на закупку #").replace("rev.","рев.").replace(/\bdd\b/,"от");}
function translateContract(v){return String(v).replace("to Contract","к контракту").replace(/\bdd\b/,"от");}
function extractPoDate(h){const m=h.match(/dd\s+(\d{2})\.(\d{2})\.(\d{4})/i);if(m)return new Date(+m[3],+m[2]-1,+m[1]);return null;}
function addMonths(d,n){const r=new Date(d);r.setMonth(r.getMonth()+n);return r;}
function fmtDate(d){return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear();}
function log(msg,type=''){const box=document.getElementById('logBox');box.style.display='block';const d=document.createElement('div');d.className=type;d.textContent=msg;box.appendChild(d);box.scrollTop=box.scrollHeight;}
function setProgress(pct,label){document.getElementById('progressWrap').style.display='block';document.getElementById('progressBar').style.width=pct+'%';if(label)document.getElementById('progressLabel').textContent=label;}
function addDownload(label,desc,ext,blob,filename){const icons={xlsx:'📊',docx:'📝'};const a=document.createElement('a');a.className='dl-btn';a.href=URL.createObjectURL(blob);a.download=filename;a.innerHTML='<span class="dl-icon">'+(icons[ext]||'📄')+'</span><div class="dl-info"><div class="dl-name">'+label+'</div><div class="dl-desc">'+desc+'</div></div><span class="dl-ext">'+ext+'</span>';document.getElementById('downloads').appendChild(a);}
async function extractPdfText(file){const ab=await file.arrayBuffer();const pdf=await pdfjsLib.getDocument({data:ab}).promise;let text='';for(let i=1;i<=pdf.numPages;i++){const page=await pdf.getPage(i);const tc=await page.getTextContent();text+=tc.items.map(x=>x.str).join(' ')+'\n';}return text;}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function wp(text,bold=false,sz=20){const b=bold?'<w:b/>':"";return '<w:p><w:r><w:rPr>'+b+'<w:sz w:val="'+sz+'"\/></w:rPr><w:t xml:space="preserve">'+esc(text)+'</w:t></w:r></w:p>';}
function wtc(text,sz=18){return '<w:tc><w:tcPr><w:tcW w:w="4500" w:type="dxa"\/></w:tcPr><w:p><w:r><w:rPr><w:sz w:val="'+sz+'"\/></w:rPr><w:t xml:space="preserve">'+esc(text)+'</w:t></w:r></w:p></w:tc>';}
function wrow(...cells){return '<w:tr>'+cells.map(c=>wtc(c)).join('')+'</w:tr>';}
function buildDocxXml(f){const itemRows=(f.items||[]).map(it=>wrow(it.desc,it.qty,it.price,it.vat,it.total)).join('');return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'+wp('КОММЕРЧЕСКИЙ ИНВОЙС',true,28)+wp('')+wp('Ссылка Заказчика: '+esc(f.custRef)+'  Номер контракта: '+esc(f.contract),false,18)+wp('Наша ссылка: '+esc(f.ourRef)+'  Валюта: GBP  Условия: ПРОФОРМА',false,18)+wp('Дата: '+esc(f.date)+'  Код: '+esc(f.custCode),false,18)+wp('')+wp('Адрес: ТОО Тянь-Шань Engineering, Атакент, ул. Тимирязева, 42, пав. 17, Алматы',false,18)+wp('')+'<w:tbl><w:tblPr><w:tblStyle w:val="TableGrid"\/><w:tblW w:w="9000" w:type="dxa"\/></w:tblPr><w:tr><w:tc><w:tcPr><w:tcW w:w="3600" w:type="dxa"\/></w:tcPr><w:p><w:r><w:rPr><w:b/><w:sz w:val="18"\/></w:rPr><w:t>Описание</w:t></w:r></w:p></w:tc><w:tc><w:tcPr><w:tcW w:w="900" w:type="dxa"\/></w:tcPr><w:p><w:r><w:rPr><w:b/><w:sz w:val="18"\/></w:rPr><w:t>Кол-во</w:t></w:r></w:p></w:tc><w:tc><w:tcPr><w:tcW w:w="1500" w:type="dxa"\/></w:tcPr><w:p><w:r><w:rPr><w:b/><w:sz w:val="18"\/></w:rPr><w:t>Цена (£)</w:t></w:r></w:p></w:tc><w:tc><w:tcPr><w:tcW w:w="900" w:type="dxa"\/></w:tcPr><w:p><w:r><w:rPr><w:b/><w:sz w:val="18"\/></w:rPr><w:t>НДС</w:t></w:r></w:p></w:tc><w:tc><w:tcPr><w:tcW w:w="2100" w:type="dxa"\/></w:tcPr><w:p><w:r><w:rPr><w:b/><w:sz w:val="18"\/></w:rPr><w:t>Итого (£)</w:t></w:r></w:p></w:tc></w:tr>'+itemRows+'</w:tbl>'+wp('')+wp('30% предоплата — £ '+esc(f.prepay),true,18)+wp('70% оплата перед отправкой — £ '+esc(f.remaining),true,18)+wp('')+wp('Всего: £ '+esc(f.total)+'  НДС: £ 0.00  Итого: £ '+esc(f.total),false,18)+wp('')+'<w:tbl><w:tblPr><w:tblStyle w:val="TableGrid"\/><w:tblW w:w="9000" w:type="dxa"\/></w:tblPr><w:tr><w:tc><w:tcPr><w:tcW w:w="4500" w:type="dxa"\/></w:tcPr>'+wp('Счёт в фунтах:',true,18)+wp('HSBC UK Bank PLC',false,18)+wp('Rotork UK Ltd.',false,18)+wp('SWIFT: HBUKGB4103B',false,18)+wp('IBAN: GB94HBUK40141333958183',false,18)+wp('Сорт: 40-14-13 / Счёт: 33958183',false,18)+'</w:tc><w:tc><w:tcPr><w:tcW w:w="4500" w:type="dxa"\/></w:tcPr>'+wp('Проформа/наличные',false,18)+wp('Рег. Англия 1090344',false,18)+wp('Rotork House, Brassmill Lane, Bath BA1 3JQ',false,18)+wp('VAT: GB 180 3944 59',false,18)+'</w:tc></w:tr></w:tbl><w:sectPr/></w:body></w:document>';}
async function buildDocxBlob(f){const docXml=buildDocxXml(f);const rels='<?xml version="1.0"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"\/></Relationships>';const wRels='<?xml version="1.0"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"\/></Relationships>';const ct='<?xml version="1.0"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"\/><Default Extension="xml" ContentType="application/xml"\/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"\/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"\/></Types>';const styles='<?xml version="1.0"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:style w:type="table" w:styleId="TableGrid"><w:name w:val="Table Grid"\/></w:style></w:styles>';const zip=new JSZip();zip.file('[Content_Types].xml',ct);zip.file('_rels/.rels',rels);zip.file('word/document.xml',docXml);zip.file('word/_rels/document.xml.rels',wRels);zip.file('word/styles.xml',styles);return zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});}
function findTotalRow(ws){const range=XLSX.utils.decode_range(ws['!ref']||'A1:G50');for(let r=range.s.r;r<=range.e.r;r++){for(let c=range.s.c;c<=range.e.c;c++){const cell=ws[XLSX.utils.encode_cell({r,c})];if(cell&&typeof cell.v==='string'&&cell.v.toLowerCase().includes('итого'))return r+1;}}return 22;}
document.getElementById('runBtn').addEventListener('click',async()=>{document.getElementById('downloads').innerHTML='';document.getElementById('logBox').innerHTML='';document.getElementById('errorBox').style.display='none';document.getElementById('outputSection').style.display='none';document.getElementById('runBtn').disabled=true;setProgress(5,'Читаю...');
try{log('Читаю PO...');const ab=await state.xlsxFile.arrayBuffer();const wb=XLSX.read(ab,{type:'array',cellDates:true});const ws=wb.Sheets['PO'];if(!ws)throw new Error('Лист PO не найден');setProgress(15,'');const headerVal=ws['C2']?XLSX.utils.format_cell(ws['C2']):'';const poDate=extractPoDate(headerVal);const delDate=poDate?addMonths(poDate,11):addMonths(new Date(),11);log('PO: '+fmtDate(poDate||new Date())+' → '+fmtDate(delDate),'ok');const totalRow=findTotalRow(ws);const dirRow=totalRow+4;const dirCoord=XLSX.utils.encode_cell({r:dirRow-1,c:2});setProgress(25,'EN PO...');const wbEn=XLSX.read(ab,{type:'array',cellDates:true});const wsEn=wbEn.Sheets['PO'];wsEn['D14']={t:'d',v:delDate,z:'DD.MM.YYYY'};wsEn[dirCoord]={t:'s',v:'General director _________________________________   Mukhtaganova G.R.'};const enRange=XLSX.utils.decode_range(wsEn['!ref']||'B1:G22');if(enRange.e.r<dirRow-1)enRange.e.r=dirRow-1;wsEn['!ref']=XLSX.utils.encode_range(enRange);const enBlob=new Blob([XLSX.write(wbEn,{type:'array',bookType:'xlsx'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});addDownload('PO — английская','','xlsx',enBlob,state.xlsxFile.name.replace(/\.xlsx$/i,'')+'_английский.xlsx');log('✓ EN','ok');setProgress(45,'RU PO...');const wbRu=XLSX.read(ab,{type:'array',cellDates:true});const wsRu=wbRu.Sheets['PO'];if(wsRu['C2'])wsRu['C2']={t:'s',v:translateHeader(headerVal)};const c3=wsRu['C3'];if(c3)wsRu['C3']={t:'s',v:translateContract(XLSX.utils.format_cell(c3))};for(const coord of TRANSLATE_COORDS){if(coord==='C2'||coord==='C3')continue;const cell=wsRu[coord];if(cell&&cell.v!==undefined){const orig=typeof cell.v==='string'?cell.v:XLSX.utils.format_cell(cell);const tr=translateCell(orig);if(tr!==orig)wsRu[coord]={t:'s',v:tr};}}wsRu['D14']={t:'d',v:delDate,z:'DD.MM.YYYY'};wsRu[XLSX.utils.encode_cell({r:dirRow-1,c:2})]={t:'s',v:'Генеральный директор _________________________________   Мухтаганова Г.Р.'};const ruRange=XLSX.utils.decode_range(wsRu['!ref']||'B1:G22');if(ruRange.e.r<dirRow-1)ruRange.e.r=dirRow-1;wsRu['!ref']=XLSX.utils.encode_range(ruRange);const ruBlob=new Blob([XLSX.write(wbRu,{type:'array',bookType:'xlsx'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});addDownload('PO — русская','','xlsx',ruBlob,state.xlsxFile.name.replace(/\.xlsx$/i,'')+'_русский.xlsx');log('✓ RU','ok');setProgress(65,'PDF...');const pdfText=await extractPdfText(state.pdfFile);setProgress(82,'');const g=(pattern,def='')=>{const m=pdfText.match(pattern);return m?m[1].trim():def;};const custRef=g(/Customer Reference:\s*(.+)/,'PO #73799');const ourRef=g(/Our Reference:\s*(.+)/,'CUK132578-01-1');const invDate=g(/Invoice Date:\s*(\S+)/,'30.03.2026');const custCode=g(/Customer Code:\s*(\S+)/,'C02047');const contract=g(/(ROTSALGOODS\S+)/,'ROTSALGOODS2022UK');const total=g(/Grand Total\s+([\d,. ]+)/,'4 320.00').trim();const prepay=g(/30%[^\n]*?(\d[\d, .]+)/,'1 296.00').trim();const remain=g(/70%[^\n]*?(\d[\d, .]+)/,'3 024.00').trim();const phone=g(/Credit control:\s*(\S+)/,'+441132057271');const items=[];const im=pdfText.match(/(SS\S+[\w\s\-]+?)\s{2,}(\d+)\s+[£]?([\d,. ]+)\s+[£]?([\d,. ]+)/);if(im){items.push({desc:im[1].replace('Limit Switch Box Soldo','Блок концевых выключателей Soldo').replace('Limit Switch Box','Блок концевых выключателей').trim(),qty:im[2],price:'£ '+im[3].trim(),vat:'0%',total:'£ '+im[4].trim()});}else{items.push({desc:'SS5022E‐2‐02601 Блок концевых выключателей Soldo',qty:'3',price:'£ 1 440.00',vat:'0%',total:'£ 4 320.00'});}
const docBlob=await buildDocxBlob({custRef,ourRef,date:invDate,custCode,contract,items,total,prepay,remain,creditPhone:phone});addDownload('Инвойс — перевод','','docx',docBlob,'Инвойс_перевод_'+state.xlsxFile.name.replace(/\.xlsx$/i,'')+'.docx');log('✓ Инвойс','ok');setProgress(100,'Готово!');document.getElementById('outputSection').style.display='block';log('Готово! Нажми на каждый файл.','ok');}catch(e){const eb=document.getElementById('errorBox');eb.style.display='block';eb.textContent='Ошибка: '+e.message;log('Ошибка: '+e.message,'err');}finally{document.getElementById('runBtn').disabled=false;checkReady();}});
</script>
</body>
</html>
