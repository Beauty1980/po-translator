<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Перевод PO и инвойса</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f5f5f0;color:#1a1a1a;min-height:100vh;padding:2rem 1rem}
.w{max-width:620px;margin:0 auto}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:1.5rem}
.lm{width:36px;height:36px;background:#1a1a1a;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;color:white;font-weight:700}
.lt{font-size:13px;color:#888}
h1{font-size:22px;font-weight:600;margin-bottom:4px}
.sub{font-size:14px;color:#666;margin-bottom:2rem}
.card{background:white;border-radius:12px;padding:1.25rem;margin-bottom:12px;border:1px solid #e8e8e4}
.lbl{font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.dz{border:1.5px dashed #d0d0cc;border-radius:8px;padding:1.5rem;text-align:center;cursor:pointer;position:relative}
.dz:hover{background:#f8f8f5}
.dz input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.di{font-size:28px;margin-bottom:8px}
.dt{font-size:14px;color:#888}
.dh{font-size:12px;color:#aaa;margin-top:4px}
.fok{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#f0faf4;border-radius:8px;margin-top:8px;border:1px solid #c3e6d0}
.fn{font-size:13px;flex:1;word-break:break-all}
.fc{font-size:12px;color:#888;background:none;border:none;cursor:pointer;padding:2px 8px}
.btn{width:100%;padding:14px;font-size:15px;font-weight:600;background:#1a1a1a;color:white;border:none;border-radius:10px;cursor:pointer;margin-top:4px}
.btn:disabled{background:#ccc;cursor:not-allowed}
.pw{margin-top:12px;display:none}
.pt{height:4px;background:#e8e8e4;border-radius:2px;overflow:hidden}
.pb{height:100%;background:#1a1a1a;border-radius:2px;transition:width .4s}
.pl{font-size:12px;color:#888;margin-top:6px}
.log{background:#f8f8f5;border-radius:8px;padding:12px;font-size:12px;font-family:monospace;color:#666;max-height:160px;overflow-y:auto;margin-top:12px;display:none;line-height:1.8;border:1px solid #e8e8e4}
.ok{color:#1a7a40}.er{color:#c0392b}
.st{font-size:12px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.08em;margin:16px 0 8px}
.dls{display:flex;flex-direction:column;gap:8px}
.dl{display:flex;align-items:center;gap:12px;padding:12px 16px;background:white;border-radius:10px;border:1px solid #e8e8e4;cursor:pointer;text-decoration:none;color:#1a1a1a}
.dl:hover{background:#f5f5f0}
.di2{font-size:22px}.di3{flex:1}
.dn{font-size:14px;font-weight:500}.dd{font-size:12px;color:#888;margin-top:2px}
.de{font-size:11px;font-weight:600;color:#666;background:#f0f0ec;padding:3px 8px;border-radius:5px;text-transform:uppercase}
.eb{background:#fff5f5;border:1px solid #fcc;border-radius:8px;padding:12px 16px;font-size:13px;color:#c0392b;margin-top:12px;display:none}
</style></head><body>
<div class="w">
<div class="logo"><div class="lm">TS</div><div class="lt">Tien-Shan Engineering LLP</div></div>
<h1>Перевод PO и инвойса</h1>
<p class="sub">Загрузи два исходных файла — получи три готовых документа</p>
<div class="card"><div class="lbl">Файл 1 — Purchase Order</div>
<div class="dz" id="dz1"><input type="file" accept=".xlsx" id="f1">
<div class="di">📊</div><div class="dt">Нажми или перетащи файл PO</div><div class="dh">.xlsx</div></div>
<div id="f1i"></div></div>
<div class="card"><div class="lbl">Файл 2 — Proforma Invoice</div>
<div class="dz" id="dz2"><input type="file" accept=".pdf" id="f2">
<div class="di">📄</div><div class="dt">Нажми или перетащи PDF</div><div class="dh">.pdf</div></div>
<div id="f2i"></div></div>
<button class="btn" id="btn" disabled>Создать переводы</button>
<div class="pw" id="pw"><div class="pt"><div class="pb" id="pb" style="width:0%"></div></div><div class="pl" id="pl">Обрабатываю...</div></div>
<div class="eb" id="eb"></div><div class="log" id="log"></div>
<div id="out" style="display:none"><div class="st">Готовые файлы</div><div class="dls" id="dls"></div></div>
</div>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
var S={x:null,p:null};
function sd(z,i,n,e){var d=document.getElementById(z),inp=document.getElementById(i);
inp.onchange=function(){if(inp.files[0])sf(inp.files[0],n,e)};
var dz=document.getElementById(z);
dz.ondragover=function(ev){ev.preventDefault()};
dz.ondrop=function(ev){ev.preventDefault();var f=ev.dataTransfer.files[0];if(f)sf(f,n,e)};}
function sf(f,n,e){document.getElementById(n).innerHTML="<div class=fok><span class=fn>"+f.name+"</span><button class=fc onclick=cf(this)>X</button></div>";
if(e==="x")S.x=f;else S.p=f;cr();}
function cf(b){var p=b.parentNode.parentNode;if(p.id==="f1i"){S.x=null;document.getElementById("f1").value="";}else{S.p=null;document.getElementById("f2").value="";}p.innerHTML="";cr();}
function cr(){document.getElementById("btn").disabled=!(S.x&&S.p);}
sd("dz1","f1","f1i","x");sd("dz2","f2","f2i","p");
function lg(m,t){var b=document.getElementById("log");b.style.display="block";var d=document.createElement("div");if(t)d.className=t;d.textContent=m;b.appendChild(d);b.scrollTop=b.scrollHeight;}
function sp(p,l){document.getElementById("pw").style.display="block";document.getElementById("pb").style.width=p+"%";if(l)document.getElementById("pl").textContent=l;}
function b64(ab){var u=new Uint8Array(ab),s="";for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s);}
function adl(b,fn,m){var u=new Uint8Array(atob(b).split("").map(function(c){return c.charCodeAt(0);}));
var a=document.createElement("a");a.className="dl";a.href=URL.createObjectURL(new Blob([u],{type:m}));a.download=fn;
var ext=fn.split(".").pop();
var lbl=fn.indexOf("анг")>=0?"PO — английская":fn.indexOf("рус")>=0?"PO — русская":"Инвойс — перевод";
a.innerHTML="<span class=di2>"+(ext==="xlsx"?"📊":"📝")+"</span><div class=di3><div class=dn>"+lbl+"</div><div class=dd>"+fn+"</div></div><span class=de>"+ext+"</span>";
document.getElementById("dls").appendChild(a);}
async function p2t(f){var ab=await f.arrayBuffer(),p=await pdfjsLib.getDocument({data:ab}).promise,t="";
for(var i=1;i<=p.numPages;i++){var pg=await p.getPage(i),tc=await pg.getTextContent();t+=tc.items.map(function(x){return x.str;}).join(" ")+"\n";}return t;}
document.getElementById("btn").onclick=async function(){
document.getElementById("dls").innerHTML="";document.getElementById("log").innerHTML="";
document.getElementById("eb").style.display="none";document.getElementById("out").style.display="none";
document.getElementById("btn").disabled=true;sp(5,"читаю...");
try{
lg("читаю xlsx...");var xb=b64(await S.x.arrayBuffer());sp(20,"читаю PDF...");
lg("читаю PDF...");var pt=await p2t(S.p);sp(35,"отправляю...");
var stem=S.x.name.replace(/\.xlsx$/i,"");
var r=await fetch("/api/translate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({xlsx:xb,pdf_text:pt,stem:stem})});
if(!r.ok){var er=await r.json().catch(function(){return{error:r.statusText};});throw new Error(er.error||r.statusText);}
sp(85,"получаю...");var d=await r.json();lg("готово!","ok");
sp(95,"");
var xm="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
var dm="application/vnd.openxmlformats-officedocument.wordprocessingml.document";
adl(d.en_xlsx,stem+"_английский.xlsx",xm);
adl(d.ru_xlsx,stem+"_русский.xlsx",xm);
adl(d.inv_docx,"Инвойс_перевод_"+stem+".docx",dm);
sp(100,"готово!");document.getElementById("out").style.display="block";
lg("Три файла готовы!","ok");
}catch(e){document.getElementById("eb").style.display="block";document.getElementById("eb").textContent="Ошибка: "+e.message;lg("Ошибка: "+e.message,"er");}
finally{document.getElementById("btn").disabled=false;cr();}
};
</script></body></html>
